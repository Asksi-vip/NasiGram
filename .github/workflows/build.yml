name: Build

on:
  push:
    branches: [ "main", "dev", "ci" ]
    paths-ignore:
      - '**.md'
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fast Build ARM64 APK with Gradle
        run: ./gradlew assembleDebug -PabiList=arm64-v8a --parallel --build-cache --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NasiGram-APK
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
