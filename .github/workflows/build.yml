name: Build

on:
  push:
    branches: [ "main", "dev", "ci" ]
    paths-ignore:
      - '**.md'
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx6g -XX:+UseParallelGC"
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build ARM64 & ARMv7 APKs with Gradle
        run: ./gradlew assembleDebug -PabiList=arm64-v8a,armeabi-v7a --parallel --build-cache --stacktrace

      - name: Upload APKs as Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: TMessagesProj_App/build/outputs/apk/debug/*.apk
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
